name: MEU checks and Pages
on:
  push:
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  specifications:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run spec:validate
        env:
          OPENSPEC_TELEMETRY: '0'

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare checksum-pinned tools
        run: python tools/bootstrap.py
      - name: Compile and run pure C tests and scripted scenario
        run: python tools/build.py native --test
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows-foundation
          path: |
            build/native/bin/
            build/native/Testing/
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-24.04
    container: gcc:14.2.0-bookworm
    steps:
      - name: Install window, OpenGL, audio, and headless display dependencies
        run: |
          apt-get update
          apt-get install -y python3 ca-certificates git libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libasound2-dev libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev xvfb xauth
      - uses: actions/checkout@v7.0.1
      - run: python3 tools/bootstrap.py
      - name: Native build, C tests and actual software-OpenGL interior, piloting, lifecycle and persistence tours
        run: xvfb-run -a python3 tools/build.py native --test --tour --pilot --lifecycle --persistence --expedition
        env:
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Address and undefined behavior checks on core and scenario
        run: python3 tools/build.py core --test --sanitizers
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: linux-foundation
          path: |
            build/native/bin/
            build/native/Testing/
            build/native/persistence-replay/
            build/core-sanitizers/Testing/
            test-results/
          if-no-files-found: warn

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 tools/bootstrap.py --web
      - name: Compile WebAssembly client and run compiled core/scenario tests
        run: python3 tools/build.py web --test
      - run: npx playwright install --with-deps chromium webkit
      - name: Captured desktop mouse regression
        run: xvfb-run -a npm run test:web -- tests/web/mouse.spec.cjs --project=desktop
      - name: Pip guide desktop and phone input tests
        # Run the new guide first so help/input failures surface before the full route.
        run: xvfb-run -a npm run test:web -- --grep "Pip"
      - name: Complete desktop and phone input routes
        run: xvfb-run -a npm run test:web
      - name: Build without browser test diagnostics
        run: python3 tools/build.py web --release --test
      - name: Shipping-like browser launch and durable save round trip
        run: xvfb-run -a npm run test:web -- --grep "renders the C/OpenGL room|persists settings|persists a saved journey|click captures the desktop mouse|Pip explains the game"
        env:
          MEU_RELEASE: '1'
      - name: Stage public runtime files
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/m1-authored-expedition')
        run: |
          mkdir -p dist/pages
          cp build/web-release/bin/{index.html,index.js,index.wasm,input.js,storage.js,style.css} dist/pages/
          touch dist/pages/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > dist/pages/revision.txt
      - name: Upload Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/m1-authored-expedition')
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/pages
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: web-foundation
          path: |
            build/web-release/bin/
            build/web/Testing/
            test-results/
            playwright-report/
          if-no-files-found: warn

  deploy-pages:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/m1-authored-expedition')
    needs: [specifications, windows, linux, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Publish verified build
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  verify-pages:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/m1-authored-expedition')
    needs: deploy-pages
    runs-on: ubuntu-24.04
    env:
      MEU_RELEASE: '1'
      MEU_BASE_URL: ${{ needs.deploy-pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Confirm published source revision
        run: |
          node --input-type=module - <<'JS'
          const url = new URL('revision.txt', process.env.MEU_BASE_URL);
          url.searchParams.set('commit', process.env.GITHUB_SHA);
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch(url, { cache: 'no-store' });
            if (response.ok && (await response.text()).trim() === process.env.GITHUB_SHA) {
              console.log('Published revision verified:', process.env.GITHUB_SHA);
              process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('The published site did not serve the expected source revision.');
          JS
      - run: npx playwright install --with-deps chromium webkit
      - name: Test live page and saved journeys on desktop and phone layouts
        run: xvfb-run -a npm run test:web -- --grep "renders the C/OpenGL room|persists settings|persists a saved journey|click captures the desktop mouse|Pip explains the game"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: live-pages-checks
          path: |
            test-results/web-release/
            playwright-report/release/
