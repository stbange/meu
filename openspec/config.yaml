schema: spec-driven

context: |
  Mechanized Exploration Unit is a separate single-player game concept.
  M0a–M0e and M1a–M1e are implemented. M0f device/performance review and combined M0/M1 acceptance remain pending; the user deferred all human reviews until after M1. M2–M4 are unimplemented.
  Game design and unimplemented change requirements remain proposals; acceptance is recorded separately.
  The player is the sole human, always viewed in first person, including piloting.
  A skyscraper-sized robot is vehicle, explorable maintenance space, and home.
  Robotic assistants may help; no human crew or present alien population.
  Sunlight and alien power grids supply energy; salvage enables technology integration.
  Vac-suit egress is possible only where environmental and access conditions permit it.
  Alien ruins and their landscape are procedurally generated for replayability.
  Target C with SDL and OpenGL on Windows, Linux, and the web.
  Web controls and layouts must work on small touch screens from the foundation.
  docs/game-design-draft.md distinguishes requested requirements from proposed defaults.
  Main specifications are reserved for implemented, verified behavior.

rules:
  proposal:
    - State scope, dependencies, exclusions, and proposed defaults.
  specs:
    - Use SHALL or MUST and observable WHEN/THEN scenarios including failure behavior.
    - Preserve exclusive first-person play and touch access to required actions.
    - Keep technical implementation choices in design rather than behavioral requirements.
  design:
    - Explain persistence, coordinate handling, platform limits, and performance risks.
  tasks:
    - Map implementation tasks to requirement identifiers and verification evidence.
    - Keep implementation, automated verification, and user acceptance separate.
    - Leave all incomplete and unverified tasks unchecked.
